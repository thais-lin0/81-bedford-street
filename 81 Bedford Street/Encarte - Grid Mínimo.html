<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>81 Bedford Street — Encarte (Grid Mínimo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #cfc8b6; }
  #root { height: 100vh; }
  :root { --paper: #f1ebdc; --paper2: #e8e0cc; --accent: #33493d; --lyric-font: 'Archivo', sans-serif; }
  .hide-notes .hf-notes { display: none !important; }
  /* photo treatment overrides (baked file is already warm sepia) */
  .hf-photo { transition: filter .2s; }
  body[data-photo="bw"]   .hf-photo { filter: grayscale(1) contrast(1.05); }
  body[data-photo="cool"] .hf-photo { filter: hue-rotate(-12deg) saturate(0.9); }
  * { -webkit-font-smoothing: antialiased; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hifi-kit.jsx"></script>
<script type="text/babel" src="pages-d.jsx"></script>
<script type="text/babel">
const LYRIC_FONTS = {
  'Grotesk': "'Archivo', sans-serif",
  'Serif': "'Newsreader', Georgia, serif",
  'Mono': "'Space Mono', monospace",
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#33493d",
  "paper": [
    "#f1ebdc",
    "#e8e0cc"
  ],
  "lyricFace": "Serif",
  "showNotes": true,
  "photo": "sepia"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--accent', t.accent);
    r.style.setProperty('--paper', t.paper[0]);
    r.style.setProperty('--paper2', t.paper[1]);
    r.style.setProperty('--lyric-font', LYRIC_FONTS[t.lyricFace] || LYRIC_FONTS.Grotesk);
    document.body.classList.toggle('hide-notes', !t.showNotes);
    document.body.dataset.photo = t.photo;
  }, [t.accent, t.paper, t.lyricFace, t.showNotes, t.photo]);

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="encarte-d" title="81 Bedford Street — Encarte" subtitle="Direção D · Grid Mínimo (alta fidelidade). Abra qualquer página em tela cheia (← → Esc). A letra é um spread de duas páginas, com as marcações de arranjo na margem.">
          {HiFiPages()}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Letra" />
        <TweakRadio label="Tipografia da letra" value={t.lyricFace}
          options={['Grotesk', 'Serif', 'Mono']}
          onChange={(v) => setTweak('lyricFace', v)} />
        <TweakToggle label="Marcações de arranjo" value={t.showNotes}
          onChange={(v) => setTweak('showNotes', v)} />
        <TweakSection label="Paleta" />
        <TweakColor label="Cor de destaque" value={t.accent}
          options={['#33493d', '#3f5e57', '#5d6b3a', '#41566e', '#26251f']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakColor label="Papel" value={t.paper}
          options={[['#f1ebdc', '#e8e0cc'], ['#efe9da', '#e4dac2'], ['#f5f1e9', '#ece6d8'], ['#e9e1cd', '#ddd2b8']]}
          onChange={(v) => setTweak('paper', v)} />
        <TweakSection label="Fotos" />
        <TweakRadio label="Tratamento" value={t.photo}
          options={['sepia', 'bw', 'cool']}
          onChange={(v) => setTweak('photo', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
