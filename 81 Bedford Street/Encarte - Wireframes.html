<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Encarte — Thais Lino · 81 Bedford Street (wireframes)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Caveat:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #b9b3a4; }
  #root { height: 100vh; }
  :root { --wf-paper: #f3eee1; --wf-paper2: #ece5d3; --wf-accent: #33493d; }
  .hide-notes .wf-note { display: none !important; }
  * { -webkit-font-smoothing: antialiased; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-kit.jsx"></script>
<script type="text/babel" src="dir-a.jsx"></script>
<script type="text/babel" src="dir-b.jsx"></script>
<script type="text/babel" src="dir-c.jsx"></script>
<script type="text/babel" src="dir-d.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#33493d",
  "paper": ["#f3eee1", "#ece5d3"],
  "showNotes": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--wf-accent', t.accent);
    r.style.setProperty('--wf-paper', t.paper[0]);
    r.style.setProperty('--wf-paper2', t.paper[1]);
    document.body.classList.toggle('hide-notes', !t.showNotes);
  }, [t.accent, t.paper, t.showNotes]);

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="dir-a" title="A · Tracklist Thread" subtitle="O player da capa vira o fio condutor do encarte inteiro — barra de progresso em todo spread, letra ao lado do 'now playing'.">
          {PanelsA()}
        </DCSection>
        <DCSection id="dir-b" title="B · Editorial" subtitle="Revista tipográfica: Helvetica gigante, fotos full-bleed, números de página enormes, letras em 2 colunas.">
          {PanelsB()}
        </DCSection>
        <DCSection id="dir-c" title="C · Field Notes" subtitle="Diário do West Village: polaroids coladas, legendas à mão, letras datilografadas, mapa de Bedford St. Pessoal e quente.">
          {PanelsC()}
        </DCSection>
        <DCSection id="dir-d" title="D · Grid Mínimo" subtitle="Grid suíço, muito ar, tracklist em monospace, fios de cabelo, fotos em molduras idênticas. Quieto e moderno.">
          {PanelsD()}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Paleta" />
        <TweakColor label="Cor de destaque" value={t.accent}
          options={['#33493d', '#3f5e57', '#6a5a3a', '#41566e', '#2b2a26']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakColor label="Papel" value={t.paper}
          options={[['#f3eee1', '#ece5d3'], ['#efe9da', '#e6dcc4'], ['#f6f2ea', '#efe9dc'], ['#eae3d0', '#e0d6bd']]}
          onChange={(v) => setTweak('paper', v)} />
        <TweakSection label="Anotações" />
        <TweakToggle label="Mostrar notas à mão" value={t.showNotes}
          onChange={(v) => setTweak('showNotes', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
